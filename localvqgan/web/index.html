<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LocalVQGAN</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="layout">
  <aside class="panel">
    <h1>LocalVQGAN</h1>
    <label>Prompts <span class="hint">separate prompts with | and weight them like sunset:1.5 | fog:0.3</span>
      <textarea id="prompts" rows="3" placeholder="an enchanted forest | trending on artstation:0.5"></textarea>
    </label>
    <label>Checkpoint <select id="checkpoint"></select></label>
    <div id="ckpt-download" class="hidden">
      <button id="download-btn">Download checkpoint</button>
      <progress id="download-progress" max="100" value="0" class="hidden"></progress>
    </div>
    <div id="ckpt-offline" class="warn hidden">All public mirrors for this checkpoint are offline. Manual install: drop config.yaml + model.ckpt into ~/.cache/localvqgan/&lt;name&gt;/</div>
    <div class="row">
      <label>Width <input id="width" type="number" value="256" step="16" min="64"></label>
      <label>Height <input id="height" type="number" value="256" step="16" min="64"></label>
    </div>
    <div class="row">
      <label>Iterations <input id="iterations" type="number" value="300" min="1"></label>
      <label>Cutouts <input id="cutouts" type="number" value="32" min="8" max="64"></label>
    </div>
    <div class="row">
      <label>Step size <input id="step_size" type="number" value="0.1" step="0.01"></label>
      <label>Engine <select id="engine">
        <option value="auto">auto</option>
      </select></label>
    </div>
    <label class="check"><input id="fast_mode" type="checkbox"> Fast mode
      <span class="hint">coarse-to-fine: faster (~1.3&times; on Apple Silicon), same 300 iterations, slightly different look</span>
    </label>
    <details id="advanced">
      <summary>Advanced</summary>
      <div class="advanced-controls">
        <div class="row">
          <label>Cut power
            <input id="cut_pow" type="number" value="1.0" step="0.1" min="0.1">
            <span class="hint">how varied the crop sizes are — higher = more small crops, sharper details</span>
          </label>
          <label>Init weight
            <input id="init_weight" type="number" value="0" step="0.05" min="0">
            <span class="hint">how strongly to stay close to the init image (0 = ignore it)</span>
          </label>
        </div>
        <div class="row">
          <label>Display frequency
            <input id="display_freq" type="number" value="5" min="1">
            <span class="hint">how often the preview updates (lower = more updates, slightly slower)</span>
          </label>
          <label>Seed
            <input id="seed" type="number" value="-1">
            <span class="hint">reuse a number for repeatable starts (-1 = random)</span>
          </label>
        </div>
        <div class="row">
          <label>CLIP
            <select id="clip_model">
              <option>ViT-B-32</option><option>ViT-B-16</option>
            </select>
            <span class="hint">text-image model used to score each step</span>
          </label>
          <label>Precision
            <select id="precision">
              <option value="auto">auto</option>
              <option value="fp16">fp16</option>
              <option value="fp32">fp32</option>
            </select>
            <span class="hint">torch-only numeric mode (auto is usually best)</span>
          </label>
        </div>
        <label>Init image
          <input id="init_image" type="file" accept="image/*">
          <span class="hint">optional starting image for image-to-image runs</span>
        </label>
        <label>Image prompt
          <input id="image_prompt" type="file" accept="image/*">
          <span class="hint">optional image target to guide the result</span>
        </label>
      </div>
    </details>
    <div id="size-warning" class="warn hidden"></div>
    <button id="generate" class="primary">Generate</button>
    <button id="stop" class="hidden">Stop</button>
    <details id="anim">
      <summary>Animation mode</summary>
      <div id="keyframes"></div>
      <button id="add-kf">+ keyframe</button>
      <button id="animate" class="primary">Render animation</button>
    </details>
    <div id="sysinfo" class="hint"></div>
  </aside>
  <main class="stage">
    <div class="preview-wrap">
      <img id="preview" alt="">
      <div id="idle-hint">Enter a prompt and hit Generate</div>
    </div>
    <div class="statusbar">
      <span id="progress-text"></span>
      <span id="queued"></span>
      <span id="speed"></span>
      <canvas id="loss-spark" width="160" height="28"></canvas>
      <span id="error" class="warn"></span>
    </div>
  </main>
</div>
<section id="gallery-section"><h2>Gallery</h2><div id="gallery"></div></section>
<script src="app.js"></script>
</body>
</html>
