[project]
name = "localvqgan"
version = "0.1.0"
description = "Fast local VQGAN+CLIP with a web GUI"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "omegaconf",
    "numpy",
    "pillow",
    "regex",
    "fastapi",
    "uvicorn[standard]",
    "imageio[ffmpeg]",
    "requests",
    "psutil",
    "huggingface_hub",
    # Engines: Apple Silicon defaults to the slim MLX install (no ~2GB torch
    # stack); every other platform defaults to torch. `localvqgan[torch]` adds
    # torch on Apple Silicon too (needed once to convert non-prebuilt weights).
    "mlx>=0.21; sys_platform == 'darwin' and platform_machine == 'arm64'",
    "torch>=2.4; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "torchvision; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "open-clip-torch>=2.24; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "kornia>=0.7; sys_platform != 'darwin' or platform_machine != 'arm64'",
    "einops; sys_platform != 'darwin' or platform_machine != 'arm64'",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-timeout", "httpx", "localvqgan[torch]"]
torch = ["torch>=2.4", "torchvision", "open-clip-torch>=2.24", "kornia>=0.7", "einops"]
mlx = ["mlx>=0.21"]

[project.scripts]
localvqgan = "localvqgan.server.main:run"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["localvqgan*"]

[tool.setuptools.package-data]
"localvqgan.web" = ["**/*"]

[tool.pytest.ini_options]
addopts = "-m 'not slow'"
markers = ["slow: downloads models or runs real generation"]
filterwarnings = [
    # kornia calls torch.jit.script, deprecated on Python 3.14; it falls back cleanly
    "ignore:.*torch\\.jit\\.script.*:DeprecationWarning",
]
